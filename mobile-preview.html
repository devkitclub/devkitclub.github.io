<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DevKit Club responsive preview</title><style>body{margin:0;background:#20262d;color:#edf2f4;font:13px monospace}header{padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button,a{font:inherit;padding:8px;background:#0d141a;color:#b5eff0;border:1px solid #65747d}main{display:flex;justify-content:center;padding:0 20px 30px}iframe{border:1px solid #65747d;width:390px;height:740px;background:#080a0d;flex-shrink:0}p{margin:0}</style></head><body><header><label>Viewport <select id="viewport"><option value="390,740">Phone 390 × 740</option><option value="360,640">Small phone 360 × 640</option><option value="430,932">Large phone 430 × 932</option><option value="844,390">Landscape 844 × 390</option><option value="1280,800">Desktop 1280 × 800</option></select></label><label>Page <select id="page"><option value="/">Home</option><option value="/products/">Store</option><option value="/products/releasekit.html">ReleaseKit</option><option value="/products/importkit.html">ImportKit</option><option value="/free/">Free tools</option><option value="/guides/">Guides</option></select></label><button id="reload" type="button">Reload page</button><a href="./">Open website</a><p>Responsive layout preview · browser viewport, not device emulation</p></header><main><iframe id="site-view" title="DevKit Club website preview" src="./"></iframe></main><script>const frame=document.getElementById('site-view');document.getElementById('viewport').addEventListener('change',event=>{const [w,h]=event.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';});const page=document.getElementById('page');page.addEventListener('change',()=>{frame.src=page.value;});document.getElementById('reload').addEventListener('click',()=>{frame.src=page.value+'?preview='+Date.now();});</script></body></html>
